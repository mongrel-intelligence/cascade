identity:
  emoji: "\U0001F41B"
  label: Debug Update
  roleHint: Analyzes session logs to identify what went wrong
  initialMessage: "**\U0001F41B Analyzing session logs** — Reviewing what happened and identifying issues..."

# Explicit integration requirements.
integrations:
  required: []
  optional: [pm]

# FS/session access always available; PM access gated on configured integration.
capabilities:
  required:
    - fs:read
    - shell:exec
    - session:ctrl
  optional:
    - pm:read
    - pm:write
    - pm:checklist
    - pm:friction

# Debug agent is triggered manually or via internal attachment upload detection.
# No external event-based triggers are configured.
triggers: []

strategies: {}

prompts:
  taskPrompt: |
    Analyze the pre-loaded run and session data for the <%= it.detectedAgentType ?? 'unknown' %> agent<% if (it.originalWorkItemId) { %>, associated with work item <%= it.originalWorkItemId %><% } else if (it.prNumber) { %>, associated with PR #<%= it.prNumber %><% } %>. Identify what happened, the root cause, and actionable recommendations.

hint: Analyze the current issue fully before moving to the next.
