identity:
  emoji: "\U0001F4E6"
  label: Backlog Manager
  roleHint: Checks if pipeline is empty, then picks and moves the next backlog card to TODO
  initialMessage: "**\U0001F4E6 Managing backlog** — Checking pipeline status before selecting next item..."

# Explicit integration requirements.
integrations:
  required: [pm]
  optional: []

# Read-write agent that reads PM system and moves cards.
capabilities:
  required:
    - fs:read
    - shell:exec
    - session:ctrl
    - pm:read
    - pm:write
    - pm:friction
  optional: []

# Supported triggers for this agent.
# Note: The primary use case is scm:pr-merged — when a PR is merged, the pipeline
# may be clearing out, so we check if backlog work should be pulled in.
triggers:
  - event: scm:pr-merged
    label: PR Merged
    description: When a CASCADE PR is merged, check if pipeline is empty and pull next backlog item
    defaultEnabled: false
    contextPipeline: [pipelineSnapshot]
  - event: pm:status-changed
    label: Backlog / Merged Card Move
    description: >
      Triggers when a card is moved to the Backlog list (new work available) OR to the
      Merged list (a blocking dependency was resolved). Both cases may allow the next
      backlog item to be pulled into TODO. Note: when enabled, this fires for both
      list moves — they cannot be independently toggled.
    defaultEnabled: false
    parameters:
      - name: onMove
        type: boolean
        label: Fire when moved into this status
        description: Fire when an existing work item is moved into the target status
        defaultValue: true
      - name: onCreate
        type: boolean
        label: Fire when created in this status
        description: Fire when a work item is created directly in the target status
        defaultValue: false
    contextPipeline: [pipelineSnapshot]
  - event: internal:auto-chain
    label: Auto-chain after Splitting
    description: When splitting completes on a card with the auto label, immediately chain to backlog manager
    defaultEnabled: false
    contextPipeline: [pipelineSnapshot]

# Required context — runs for EVERY invocation regardless of trigger source.
# Manual `cascade runs trigger --agent-type backlog-manager` would otherwise
# skip the per-trigger contextPipeline (triggerEvent is undefined), and the
# agent would freelance with no structured PipelineSnapshotSummary JSON. Empty pipelineSnapshot result
# aborts the run with a structured error + Sentry capture under tag
# `context_pipeline_required_step_failed` (closes the 2026-04-29 incident
# where MNG-422 was pulled from SPLITTING into TODO).
requiredContext: [pipelineSnapshot]

strategies: {}

prompts:
  # The system prompt (.eta file) contains full instructions.
  # This taskPrompt provides the per-run context and directive.
  taskPrompt: |
    A PipelineSnapshotSummary JSON object has been pre-loaded into your context with the current state of all pipeline statuses (BACKLOG, TODO, IN_PROGRESS, IN_REVIEW, DONE, MERGED).

    1. Parse PipelineSnapshotSummary and use activePipelineCount for items currently in the active pipeline (TODO + IN PROGRESS + IN REVIEW).
    2. If the count is below the capacity limit (see system prompt): use PipelineSnapshotSummary.statuses.backlog.itemIds in provider order plus itemsById details to select ALL eligible unblocked items to fill remaining capacity completely — always move the maximum number possible.
    3. If already at or above capacity: exit immediately without taking action.
    4. If every BACKLOG item is blocked, post one Backlog Blocked comment on the first BACKLOG item in PipelineSnapshotSummary.statuses.backlog.itemIds order. If BACKLOG is empty, exit silently.

hint: Only act if pipeline has capacity (items in TODO + IN PROGRESS + IN REVIEW < maxInFlightItems). When acting, ALWAYS fill ALL remaining capacity.
