identity:
  emoji: "\U0001F50D"
  label: Code Review Update
  roleHint: Reviews pull request changes for quality and correctness
  initialMessage: "**\U0001F50D Reviewing code** — Examining the PR changes for quality and correctness..."

# Explicit integration requirements.
integrations:
  required: [scm]
  optional: [pm]

# Read-only agent that reviews PRs. Can submit reviews and update comments.
# Optional PM for reading linked work item context.
capabilities:
  required:
    - fs:read
    - shell:exec
    - session:ctrl
    - scm:read
    - scm:review
    - scm:comment
  optional:
    - pm:read
    - pm:friction

# Supported triggers for this agent
triggers:
  - event: scm:check-suite-success
    label: CI Passed
    description: Trigger review when CI checks pass on a PR
    defaultEnabled: false
    providers: [github]
    parameters:
      - name: authorMode
        type: select
        label: Author Filter
        description: Filter PRs by author type
        options: [own, external, all]
        defaultValue: own
    contextPipeline: [prContext, contextFiles, workItem]
  - event: scm:review-requested
    label: On Review Requested
    description: Trigger review when a CASCADE persona is explicitly requested as reviewer
    defaultEnabled: false
    providers: [github]
    contextPipeline: [prContext, contextFiles, workItem]
  - event: scm:pr-opened
    label: PR Opened
    description: Trigger review when a new PR is opened (without waiting for CI)
    defaultEnabled: false
    providers: [github]
    parameters:
      - name: authorMode
        type: select
        label: Author Filter
        description: Filter PRs by author type
        options: [own, external, all]
        defaultValue: own
    contextPipeline: [prContext, contextFiles, workItem]
strategies: {}

prompts:
  taskPrompt: |
    Review PR #<%= it.prNumber %>.

    ## How your context is shaped

    You receive a **compact per-file diff context** — each changed file appears
    as a section headed `### <filename> (<status>, +N -M)` followed by a unified
    diff hunk. Only the changed lines are in your context; unchanged parts of
    a file are not echoed. Use `Read <path>` if you need surrounding code.

    GitHub is used to enumerate changed files, but compact patch bodies are
    produced from the checked-out local PR workspace so the context is not
    limited by GitHub's `pulls.listFiles().patch` truncation behavior.

    If a **`SKIPPED FILES`** injection is present, those files were omitted from
    the compact context (because they were deleted, binary, could not be locally
    diffed, their patch was too large, or the cumulative diff budget was
    reached). When any skipped file is relevant to your review, fetch it on
    demand:

      - `cascade-tools scm get-pr-diff --prNumber <%= it.prNumber %> --path <path>` to read the file's patch
      - `Read <path>` to read the post-PR file content
      - `Grep <pattern> <path>` to search inside the file

    You are not expected to review every skipped file — only fetch when the PR
    description or another file points you at it.

    ## Work item context

    If a **ReadWorkItem** pre-fetch is present, it contains the linked PM work item
    (card/issue) with its description, acceptance criteria, and checklists. Use it
    to verify that the PR fully addresses the work item's requirements — not just
    what the PR description claims.

    ## Your task

    Examine the code changes carefully and submit your review using CreatePRReview.

hooks:
  trailing:
    scm:
      reviewDeadline: true
  finish:
    scm:
      requiresReview: true

hint: Focus on the current aspect of review before moving to the next. Read related files together.
