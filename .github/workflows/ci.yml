name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    # Run on all PRs, regardless of target branch

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Build backend
        run: npm run build

      - name: Build frontend
        run: npm run build:web

      - name: Run typecheck
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  validate-commits:
    runs-on: ubuntu-latest
    # Skip validation for PRs from dev to main (release PRs) since dev accumulates merge commit history
    if: github.event_name == 'pull_request' && !(github.head_ref == 'dev' && github.base_ref == 'main')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cascade_test
          POSTGRES_PASSWORD: cascade_test
          POSTGRES_DB: cascade_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cascade_test -d cascade_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run integration tests with coverage
        run: npm run test:integration:coverage
        env:
          TEST_DATABASE_URL: postgresql://cascade_test:cascade_test@localhost:5433/cascade_test
          REDIS_URL: redis://localhost:6379

      # Upload the integration coverage under its own flag. Codecov merges the
      # `unit` + `integration` flags per-commit, so repository/db code exercised
      # only by the integration suite (e.g. the projectsRepository worker-image
      # build-result writers) counts toward project/patch instead of reading as
      # 0% patch on the unit-only run. Thresholds are disabled for this run (see
      # the test:integration:coverage script) because the integration suite alone
      # does not exercise 80% of src/**; the combined Codecov report is the gate.
      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: integration
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-build-check:
    name: Validate Docker builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build router image
        run: docker build -f Dockerfile.router -t cascade-router:ci-check .

      - name: Build worker image
        run: docker build -f Dockerfile.worker -t cascade-worker:ci-check .

      # MNG-1055: the worker image must include the baseline native-session
      # runtime (Python shim + Playwright Chromium cache + the env var the
      # native-tool env filter forwards to agent shells). The smoke script
      # below fails loudly if any of those are missing — keeps the worker
      # image aligned with the contract documented in
      # docs/architecture/05-engine-backends.md and surfaced to agents in
      # the native-tool prompts.
      - name: Smoke-test worker runtime tools
        run: WORKER_IMAGE=cascade-worker:ci-check tests/docker/worker-runtime-tools/run-test.sh

  enforce-dev-to-main:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PRs to main must come from the dev branch, not '${{ github.head_ref }}'"
            exit 1
          fi
          echo "Source branch is dev - OK"
